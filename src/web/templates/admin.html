<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>LLM Hosting Admin</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 1rem 2rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        background: rgba(0, 0, 0, 0.03);
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1rem;
        padding: 1rem;
        overflow: hidden;
      }
      section {
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      h2 {
        margin-top: 0;
      }
      table {
        display: flex;
        flex-direction: column;
        flex: 1;
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 0.35rem 0.5rem;
        text-align: left;
      }
      tbody {
        flex: 1;
        display: block;
        overflow-y: auto;
      }
      thead,
      tbody tr {
        display: table;
        width: 100%;
        table-layout: fixed;
      }
      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
        margin-top: 1rem;
      }
      label {
        font-size: 0.8rem;
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      input,
      select,
      textarea {
        padding: 0.4rem;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        font: inherit;
      }
      textarea {
        min-height: 80px;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      button {
        padding: 0.4rem 0.75rem;
        border-radius: 4px;
        border: none;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        color: white;
      }
      button.danger {
        background: #dc2626;
        color: white;
      }
      .json-editor,
      .log-viewer {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .json-editor textarea {
        flex: 1;
      }
      .log-output {
        flex: 1;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 6px;
        padding: 0.5rem;
        overflow-y: auto;
        font-family: "SFMono-Regular", Consolas, monospace;
        font-size: 0.8rem;
      }
      .tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .tabs button {
        flex: 1;
        background: rgba(0, 0, 0, 0.1);
      }
      .tabs button.active {
        background: #2563eb;
        color: white;
      }
      .hidden {
        display: none;
      }
      .table-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        z-index: 20;
      }
      .modal-backdrop.hidden {
        display: none;
      }
      .modal-panel {
        width: min(640px, 100%);
        max-height: 90vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.97);
        color: #111;
        border-radius: 12px;
        padding: 1.25rem;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      }
      @media (prefers-color-scheme: dark) {
        .modal-panel {
          background: rgba(22, 22, 22, 0.95);
          color: #fafafa;
        }
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }
      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      button.secondary {
        background: rgba(0, 0, 0, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        button.secondary {
          background: rgba(255, 255, 255, 0.12);
          color: #f5f5f5;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LLM Hosting Admin</h1>
      <p>Manage self-hosted endpoints and monitor logs</p>
    </header>
    <main>
      <section>
        <div class="tabs">
          <button id="tab-table" class="active">Tabular Editor</button>
          <button id="tab-json">JSON Editor</button>
        </div>
        <div id="table-view" style="display: flex; flex-direction: column; flex: 1;">
          <div class="table-controls">
            <div>
              <h3 style="margin: 0">Server inventory</h3>
              <p style="margin: 0; font-size: 0.85rem; color: rgba(0,0,0,0.6)">Manage proxy/self-hosted endpoints</p>
            </div>
            <button id="open-create-modal" class="primary">Add server</button>
          </div>
          <table style="flex: 1; display: flex; flex-direction: column; height: 0;">
            <thead>
              <tr>
                <th>Name</th>
                <th>Model</th>
                <th>Mode</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="servers-tbody"></tbody>
          </table>
        </div>
        <div id="server-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
          <div class="modal-panel">
            <div class="modal-header">
              <div>
                <h3 id="server-modal-title" style="margin: 0">Add server</h3>
                <p id="server-modal-subtitle" style="margin: 0.2rem 0 0; font-size: 0.85rem; opacity: 0.8">Create or edit server metadata</p>
              </div>
              <button type="button" id="close-server-modal" class="secondary">Close</button>
            </div>
            <form id="server-form">
              <input type="hidden" id="server-id" />
              <label>
                Name
                <input id="server-name" required />
              </label>
              <label>
                Model Name
                <input id="server-model" required />
              </label>
              <label>
                Mode
                <select id="server-mode">
                  <option value="proxy">Proxy</option>
                  <option value="self-hosted">Self-hosted</option>
                </select>
              </label>
              <label>
                Status
                <select id="server-status">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="error">Error</option>
                </select>
              </label>
              <label>
                Endpoint URL
                <input id="server-endpoint" />
              </label>
              <label>
                Model Path
                <input id="server-path" />
              </label>
              <label>
                Backend Type
                <select id="server-backend">
                  <option value="">Select backend</option>
                  <option value="proxy">Proxy (external API)</option>
                  <option value="llama-cpp">llama.cpp</option>
                  <option value="transformers">Transformers</option>
                  <option value="vllm">vLLM</option>
                  <option value="mlx">MLX</option>
                  <option value="sentence-transformers">Sentence Transformers</option>
                </select>
              </label>
              <label>
                Backend Config (JSON)
                <textarea id="server-backend-config">{}</textarea>
              </label>
              <label>
                Extra Config (JSON)
                <textarea id="server-config">{}</textarea>
              </label>
              <div class="modal-actions">
                <button type="button" id="reset-form" class="secondary">Reset</button>
                <button type="submit" class="primary" id="save-server">Save changes</button>
              </div>
            </form>
          </div>
        </div>

        <div id="delete-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
          <div class="modal-panel" style="max-width: 420px">
            <div class="modal-header">
              <div>
                <h3 style="margin: 0">Delete server</h3>
                <p style="margin: 0.2rem 0 0; font-size: 0.85rem; opacity: 0.8">This action cannot be undone.</p>
              </div>
            </div>
            <p id="delete-modal-body">Are you sure?</p>
            <div class="modal-actions">
              <button type="button" id="cancel-delete" class="secondary">Cancel</button>
              <button type="button" id="confirm-delete" class="danger">Delete</button>
            </div>
          </div>
        </div>

        <div id="json-view" class="hidden json-editor">
          <textarea id="servers-json"></textarea>
          <div class="actions">
            <button id="reload-json">Reload</button>
            <button class="primary" id="save-json">Save JSON</button>
          </div>
        </div>
      </section>
      <section class="log-viewer">
        <h2>Realtime Logs</h2>
        <label>
          Filter by server name or keyword
          <select id="log-filter"></select>
        </label>
        <div class="log-output" id="log-output"></div>
      </section>
    </main>
    <script>
      const tableTab = document.getElementById('tab-table')
      const jsonTab = document.getElementById('tab-json')
      const tableView = document.getElementById('table-view')
      const jsonView = document.getElementById('json-view')
      const tbody = document.getElementById('servers-tbody')
      const form = document.getElementById('server-form')
      const resetBtn = document.getElementById('reset-form')
      const jsonTextarea = document.getElementById('servers-json')
      const reloadJsonBtn = document.getElementById('reload-json')
      const saveJsonBtn = document.getElementById('save-json')
      const logOutput = document.getElementById('log-output')
      const logFilter = document.getElementById('log-filter')
      const openCreateBtn = document.getElementById('open-create-modal')
      const serverModal = document.getElementById('server-modal')
      const serverModalTitle = document.getElementById('server-modal-title')
      const serverModalSubtitle = document.getElementById('server-modal-subtitle')
      const closeServerModalBtn = document.getElementById('close-server-modal')
      const deleteModal = document.getElementById('delete-modal')
      const deleteModalBody = document.getElementById('delete-modal-body')
      const confirmDeleteBtn = document.getElementById('confirm-delete')
      const cancelDeleteBtn = document.getElementById('cancel-delete')

      let editingId = null
      let logSource = null
      let deleteTargetId = null
      let serversCache = []

      function setActiveTab(tab) {
        tableTab.classList.toggle('active', tab === 'table')
        jsonTab.classList.toggle('active', tab === 'json')
        tableView.classList.toggle('hidden', tab !== 'table')
        jsonView.classList.toggle('hidden', tab !== 'json')
      }

      tableTab.addEventListener('click', () => setActiveTab('table'))
      jsonTab.addEventListener('click', () => setActiveTab('json'))

      function renderServers(servers) {
        tbody.innerHTML = ''
        logFilter.innerHTML = '<option value="">All logs</option>'
        servers.forEach((server) => {
          const row = document.createElement('tr')
          row.innerHTML = `
            <td>${server.name}</td>
            <td>${server.model_name}</td>
            <td>${server.mode}</td>
            <td>${server.status}</td>
            <td>
              <button data-action="edit" data-id="${server.id}">Edit</button>
              <button data-action="delete" data-id="${server.id}" class="danger">Delete</button>
            </td>
          `
          tbody.appendChild(row)
          const option = document.createElement('option')
          option.value = server.name
          option.textContent = server.name
          logFilter.appendChild(option)
        })
      }

      async function loadServers() {
        const res = await fetch('/admin/api/servers')
        const data = await res.json()
        serversCache = data
        renderServers(data)
      }

      function fillFormFromServer(server) {
        document.getElementById('server-id').value = server?.id || ''
        document.getElementById('server-name').value = server?.name || ''
        document.getElementById('server-model').value = server?.model_name || ''
        document.getElementById('server-mode').value = server?.mode || 'proxy'
        document.getElementById('server-status').value = server?.status || 'inactive'
        document.getElementById('server-endpoint').value = server?.endpoint_url || ''
        document.getElementById('server-path').value = server?.model_path || ''
        document.getElementById('server-backend').value = server?.backend_type || ''
        document.getElementById('server-backend-config').value = JSON.stringify(server?.backend_config || {}, null, 2)
        document.getElementById('server-config').value = JSON.stringify(server?.config || {}, null, 2)
      }

      function openServerModal(mode, server) {
        serverModalTitle.textContent = mode === 'edit' ? 'Edit server' : 'Add server'
        serverModalSubtitle.textContent =
          mode === 'edit'
            ? `Update metadata for ${server?.name || 'server'}`
            : 'Create a new proxy or self-hosted endpoint entry'
        if (mode === 'edit' && server) {
          editingId = server.id
          fillFormFromServer(server)
        } else {
          editingId = null
          form.reset()
          fillFormFromServer(null)
        }
        serverModal.classList.remove('hidden')
      }

      function closeServerModal() {
        serverModal.classList.add('hidden')
        editingId = null
      }

      function openDeleteModal(server) {
        deleteTargetId = server.id
        deleteModalBody.textContent = `Delete "${server.name}"? This removes its configuration from servers.json.`
        deleteModal.classList.remove('hidden')
      }

      function closeDeleteModal() {
        deleteModal.classList.add('hidden')
        deleteTargetId = null
      }

      openCreateBtn.addEventListener('click', () => openServerModal('create'))
      closeServerModalBtn.addEventListener('click', closeServerModal)
      serverModal.addEventListener('click', (event) => {
        if (event.target === serverModal) {
          closeServerModal()
        }
      })

      cancelDeleteBtn.addEventListener('click', closeDeleteModal)
      deleteModal.addEventListener('click', (event) => {
        if (event.target === deleteModal) {
          closeDeleteModal()
        }
      })

      confirmDeleteBtn.addEventListener('click', async () => {
        if (!deleteTargetId) return
        await fetch(`/admin/api/servers/${deleteTargetId}`, { method: 'DELETE' })
        closeDeleteModal()
        await loadServers()
      })

      tbody.addEventListener('click', async (event) => {
        const button = event.target.closest('button')
        if (!button) return
        const id = button.dataset.id
        if (button.dataset.action === 'edit') {
          let server = serversCache.find((s) => s.id === id)
          if (!server) {
            await loadServers()
            server = serversCache.find((s) => s.id === id)
          }
          if (!server) return
          openServerModal('edit', server)
        } else if (button.dataset.action === 'delete') {
          const server = serversCache.find((s) => s.id === id)
          if (server) {
            openDeleteModal(server)
          }
        }
      })

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        const payload = {
          id: document.getElementById('server-id').value || undefined,
          name: document.getElementById('server-name').value,
          model_name: document.getElementById('server-model').value,
          mode: document.getElementById('server-mode').value,
          status: document.getElementById('server-status').value,
          endpoint_url: document.getElementById('server-endpoint').value || null,
          model_path: document.getElementById('server-path').value || null,
          backend_type: document.getElementById('server-backend').value || null,
          backend_config: JSON.parse(document.getElementById('server-backend-config').value || '{}'),
          config: JSON.parse(document.getElementById('server-config').value || '{}'),
        }
        const isUpdate = Boolean(payload.id)
        const url = isUpdate ? `/admin/api/servers/${payload.id}` : '/admin/api/servers'
        const method = isUpdate ? 'PUT' : 'POST'
        await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        await loadServers()
        closeServerModal()
      })

      resetBtn.addEventListener('click', () => {
        editingId = null
        form.reset()
        fillFormFromServer(null)
      })

      reloadJsonBtn.addEventListener('click', async () => {
        const res = await fetch('/admin/api/servers/raw')
        const data = await res.json()
        jsonTextarea.value = JSON.stringify(data, null, 2)
      })

      saveJsonBtn.addEventListener('click', async () => {
        const payload = JSON.parse(jsonTextarea.value || '[]')
        await fetch('/admin/api/servers/raw', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        })
        await loadServers()
        alert('Servers updated')
      })

      function startLogStream() {
        if (logSource) logSource.close()
        const filter = logFilter.value
        const url = new URL('/admin/logs/stream', window.location.origin)
        if (filter) url.searchParams.set('contains', filter)
        logSource = new EventSource(url)
        logSource.onmessage = (event) => {
          const data = JSON.parse(event.data)
          const line = document.createElement('div')
          const stamp = new Date(data.timestamp * 1000).toLocaleTimeString()
          line.textContent = `[${stamp}] ${data.level} ${data.message}`
          logOutput.appendChild(line)
          logOutput.scrollTop = logOutput.scrollHeight
          const limit = 500
          while (logOutput.children.length > limit) {
            logOutput.removeChild(logOutput.firstChild)
          }
        }
      }

      logFilter.addEventListener('change', startLogStream)

      // Initialize
      ;(async function init() {
        await loadServers()
        await reloadJsonBtn.click()
        startLogStream()
      })()
    </script>
  </body>
</html>
